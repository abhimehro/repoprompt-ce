name: Integration Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches:
      - main

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration-tests:
    name: Integration (shard ${{ matrix.shard }})
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore SwiftPM build cache
        uses: actions/cache@v6
        with:
          path: |
            .build
            Packages/RepoPromptAgentProviders/.build
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-integration-${{ hashFiles('Package.swift', 'Package.resolved', 'Packages/RepoPromptAgentProviders/Package.swift', 'Packages/RepoPromptAgentProviders/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-

      - name: Build app product
        run: swift build --product RepoPrompt

      - name: Build MCP product
        run: swift build --product repoprompt-mcp

      - name: Run integration and soak tests
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/ci_app_test_runner.py \
            --tier integration \
            --keep-going \
            --shard-count 2 \
            --shard-index "${{ matrix.shard }}"
