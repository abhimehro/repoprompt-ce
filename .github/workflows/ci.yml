name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-test-bundles:
    name: Build and Static Gates
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Restore SwiftPM build cache
        id: rootbundles-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .build
            Packages/RepoPromptAgentProviders/.build
          # Own prefix: must never prefix-match the Sentry or sources caches.
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-rootbundles-${{ hashFiles('Package.swift', 'Package.resolved', 'Packages/RepoPromptAgentProviders/Package.swift', 'Packages/RepoPromptAgentProviders/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-rootbundles-${{ hashFiles('Package.swift', 'Package.resolved', 'Packages/RepoPromptAgentProviders/Package.swift', 'Packages/RepoPromptAgentProviders/Package.resolved') }}-
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-rootbundles-

      - name: Restore checksum-verified SwiftPM binary artifacts
        id: binaries-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .build/artifacts
            .build/swiftbuild/artifacts
            Packages/RepoPromptAgentProviders/.build/artifacts
            ~/Library/Caches/org.swift.swiftpm/artifacts
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-binaries-v1-${{ hashFiles('Package.resolved', 'Packages/RepoPromptAgentProviders/Package.resolved') }}

      - name: Resolve dependency downloads with bounded retries
        run: |
          python3 Scripts/ci_resolve_packages.py
          python3 Scripts/ci_resolve_packages.py --scratch-path .build/swiftbuild
          python3 Scripts/ci_resolve_packages.py --root Packages/RepoPromptAgentProviders

      - name: Run repository guardrails
        run: make guardrails

      - name: Install Swift style tools
        run: ./Scripts/install_format_tools.sh install

      - name: Run Swift style lint
        run: make lint

      - name: Run conductor tests
        run: make conductor-selftest

      - name: Set up Node for pinned Codex CLI
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.159.0

      - name: Validate Codex app-server schema contract
        run: make dev-codex-schema-check

      - name: Run release workflow tests
        run: make release-selftest

      - name: Run provider package tests
        run: ./conductor provider-test

      - name: Build root test bundles with import and type-check gates
        shell: bash
        env:
          TYPECHECK_RATCHET_ENFORCE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}
        run: |
          set -uo pipefail
          set +e
          ./conductor ci-build-tests 2>&1 | tee "$RUNNER_TEMP/ci-build-tests-conductor.txt"
          build_status=${PIPESTATUS[0]}
          set -e
          if (( build_status != 0 )); then
            log_path="$(sed -n 's/^Log:[[:space:]]*//p' "$RUNNER_TEMP/ci-build-tests-conductor.txt" | tail -n 1)"
            if [[ -n "$log_path" && -f "$log_path" ]]; then
              cp "$log_path" "$RUNNER_TEMP/ci-build-tests.log"
              echo 'Compiler errors and test failures from the full conductor log:'
              grep -E 'error:|FAIL' "$RUNNER_TEMP/ci-build-tests.log" || true
            else
              echo "Conductor full log was unavailable: $log_path" >&2
            fi
          fi
          exit "$build_status"

      - name: Upload failed root test build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: root-build-tests-failure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ci-build-tests.log
            ${{ runner.temp }}/ci-build-tests-conductor.txt
          if-no-files-found: warn

      - name: Gate compiler index ratchets on the built sources
        run: python3 Scripts/modularization_index_graph.py check --output .build/modularization/index-check.json

      # All executor-parity module checks gate PRs before merge, on the same warm VM.
      - name: Run all app-free module parity tests
        shell: bash
        run: |
          set -euo pipefail
          modules="$(python3 Scripts/modularization_affected_tests.py --all | python3 -c 'import json,sys; print(" ".join(row["module"] for row in json.load(sys.stdin)["include"]))')"
          test -n "$modules"
          for module in $modules; do
            ./conductor test --module "$module" --full-log
          done

      - name: Retain full module execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: module-execution-${{ github.run_id }}
          path: .build/ci-test-results/module-*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Archive only runnable test products and gate attestations
        run: python3 Scripts/modularization_ci_artifact.py pack --output root-build.tar.gz

      - name: Share expected coverage independently of the runnable products
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: expected-coverage-${{ github.run_id }}
          path: |
            .build/modularization/ci-test-list.txt
            .build/modularization/test-targets.json
          if-no-files-found: error
          retention-days: 7

      - name: Share the single build with test shards
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: root-build-${{ github.run_id }}
          path: root-build.tar.gz
          retention-days: 1

      # Keep binary artifacts main-scoped too; PRs restore without saving their own caches.
      - name: Save checksum-verified SwiftPM binary artifacts (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.binaries-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .build/artifacts
            .build/swiftbuild/artifacts
            Packages/RepoPromptAgentProviders/.build/artifacts
            ~/Library/Caches/org.swift.swiftpm/artifacts
          key: ${{ steps.binaries-cache.outputs.cache-primary-key }}

      # Save the compiled cache only from main, so PR runs restore a warm, main-built cache
      # (PR-scoped caches would evict it). One key per main commit keeps it current.
      - name: Save SwiftPM build cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rootbundles-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .build
            Packages/RepoPromptAgentProviders/.build
          key: ${{ steps.rootbundles-cache.outputs.cache-primary-key }}

  build-and-test:
    name: Test Root Shard (No Build)
    needs: build-test-bundles
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download the single root build
        uses: actions/download-artifact@v4
        with:
          name: root-build-${{ github.run_id }}

      - name: Restore build bundle and SwiftPM state
        shell: bash
        run: gzip -dc root-build.tar.gz | tar -xf -

      - name: Run root test shard without compiling
        run: ./conductor ci-shard --shard-count 4 --shard-index ${{ matrix.shard }} --full-log

      - name: Retain execution receipts and full shard logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: shard-execution-${{ matrix.shard }}-${{ github.run_id }}
          path: .build/ci-test-results/shard-*
          if-no-files-found: error
          retention-days: 7

  style:
    # Protect main requires exactly Style: it must be the FINAL gate, not an early green row.
    name: Style
    needs: [build-test-bundles, build-and-test, secret-scan, blueprint-pin-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fail if a prerequisite failed or was skipped
        env:
          BUILD_RESULT: ${{ needs.build-test-bundles.result }}
          SECRET_RESULT: ${{ needs.secret-scan.result }}
          SHARD_RESULT: ${{ needs.build-and-test.result }}
          PIN_RESULT: ${{ needs.blueprint-pin-check.result }}
        run: test "$BUILD_RESULT" = success && test "$SHARD_RESULT" = success && test "$SECRET_RESULT" = success && test "$PIN_RESULT" = success

      - name: Download expected coverage
        uses: actions/download-artifact@v4
        with:
          name: expected-coverage-${{ github.run_id }}
          path: expected-coverage

      - name: Download all shard execution receipts
        uses: actions/download-artifact@v4
        with:
          pattern: shard-execution-*-${{ github.run_id }}
          path: shard-execution
          merge-multiple: true

      - name: Prove exact union and every test target
        run: python3 Scripts/ci_test_coverage.py --metadata expected-coverage --receipts shard-execution --shard-count 4

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan introduced commit range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            range="$PUSH_BEFORE_SHA..$CURRENT_SHA"
          else
            range="$CURRENT_SHA"
          fi
          gitleaks git --redact --log-opts="$range" .

      - name: Scan checked-in source tree
        run: gitleaks dir --redact .

  # Drift detection only — kept out of secret-scan so a transient fetch or a
  # wrong pin can never suppress the security scans. It still gates the merge:
  # `style` (the required check) lists this job in `needs:`.
  blueprint-pin-check:
    name: Verify blueprint gitleaks pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify blueprint darwin gitleaks pins
        shell: bash
        run: |
          set -euo pipefail
          # .devin/blueprint.yaml installs gitleaks on macOS snapshots with
          # version parsed from this file and per-arch darwin SHA-256s pinned
          # in-repo. Recompute the expected digests from the release's own
          # checksums file and fail on drift instead of letting a wrong pin
          # brick macOS setup on a developer machine.
          version="$(awk 'match($0, /gitleaks_[0-9.]+_linux_x64\.tar\.gz/) {
            print substr($0, RSTART + 9, RLENGTH - 26); exit }' .github/workflows/ci.yml)"
          [ -n "${version}" ] || { echo "could not parse gitleaks version from ci.yml" >&2; exit 1; }
          # ~4 KB checksums file: --max-time is per-attempt (30s each),
          # --retry-max-time caps the retry window at 60s — worst case ≈90s,
          # well inside the job's 5-minute timeout.
          sums="$(curl --proto '=https' --tlsv1.2 -fsSL \
            --retry 3 --retry-delay 2 --retry-max-time 60 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt")"
          # Drive the check from the arch/sha pairs actually declared in the
          # blueprint, so added or reformatted case arms are verified too.
          # Strip YAML comments first: a doc line mentioning `arch = "` must
          # not inflate `declared` and fail Style on a comment-only edit.
          # Both counts are occurrence-level (grep -o, not grep -c): `declared`
          # counts every `arch = "` token regardless of the value's format,
          # while `pairs` needs the strict `arch="..."; sha="..."` shape. A
          # reformat that breaks that shape (spacing around `=`, non-lowercase
          # arch, arch/sha split across lines) keeps `declared` high and fails
          # loudly instead of dropping coverage; two arms collapsed onto one
          # line stay covered since both digests are still extracted.
          stripped="$(sed 's/#.*//' .devin/blueprint.yaml)"
          pairs="$(printf '%s\n' "${stripped}" | grep -oE 'arch="[a-z0-9_]+"; *sha *= *"[^"]*"' \
            | sed 's/.*arch="\([^"]*\)"; *sha *= *"\([^"]*\)".*/\1 \2/' || true)"
          declared="$(printf '%s\n' "${stripped}" | grep -oE 'arch *= *"' | wc -l | tr -d ' ' || true)"
          found="$(printf '%s\n' "${pairs}" | grep -c . || true)"
          unique="$(printf '%s\n' "${pairs}" | awk 'NF && !seen[$1]++ { n++ } END { print n+0 }')"
          [ "${declared}" -gt 0 ] && [ "${found}" -eq "${declared}" ] && [ "${unique}" -eq "${declared}" ] \
            || { echo "expected one arch/sha pair per arch= declaration (${declared}); got ${found} pairs / ${unique} unique" >&2; exit 1; }
          while read -r arch pinned; do
            printf '%s' "${pinned}" | grep -qiE '^[0-9a-f]{64}$' \
              || { echo "invalid SHA-256 pin for darwin_${arch}: ${pinned}" >&2; exit 1; }
            pinned="$(printf '%s' "${pinned}" | tr 'A-F' 'a-f')"
            asset="gitleaks_${version}_darwin_${arch}.tar.gz"
            expected="$(echo "${sums}" | awk -v a="${asset}" '$2 == a { print $1 }')"
            [ -n "${expected}" ] || { echo "no checksum published for ${asset}" >&2; exit 1; }
            [ "${pinned}" = "${expected}" ] \
              || { echo "blueprint darwin_${arch} digest mismatch: pinned=${pinned} expected=${expected}" >&2; exit 1; }
            echo "darwin_${arch} digest verified for gitleaks ${version}"
          done <<< "${pairs}"
