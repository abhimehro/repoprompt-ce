name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"

env:
  HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"

env:
  HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"

env:
  HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"

env:
  HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"

jobs:
  style:
    name: Style
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run repository guardrails
        run: make guardrails

      - name: Test Xcode workspace generator
        run: make xcode-generator-test

      - name: Install Swift style tools
        run: ./Scripts/install_format_tools.sh install

      - name: Run Swift style lint
        run: make lint

      - name: Run conductor tests
        run: make conductor-selftest

      - name: Run release workflow tests
        run: make release-selftest

  build-and-test:
    name: Build and Test
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate generated Xcode workspace
        run: make xcode-validate

      - name: Build application bundle
        run: make bundle

      - name: Check Swift compatibility
        run: make swift-compat

      - name: Run application tests
        run: make test

      - name: Run agent evaluation harnesses
        run: make evaluation-harness
