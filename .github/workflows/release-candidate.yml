name: Release Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  artifact:
    name: Package Ad-Hoc Candidate
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run release preflight
        run: ./Scripts/release.sh preflight

      - name: Package ad-hoc release candidate
        run: ./Scripts/release.sh artifact

      - name: Upload release-candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: RepoPrompt-CE-release-candidate
          path: dist/*
          if-no-files-found: error
