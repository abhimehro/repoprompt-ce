name: Security

# This workflow is the repo's CodeQL *advanced* setup. GitHub rejects SARIF
# uploads from advanced workflows while default setup is enabled, so default
# setup is intentionally disabled (Settings > Code security). Re-enabling it
# will make every CodeQL job here fail — see docs/security/initial-scan.md.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Weekly scan, Tuesday 03:37 UTC.
    - cron: '37 3 * * 2'
  workflow_dispatch:

concurrency:
  group: security-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Swift is the primary language (~93% of code). Swift requires a
          # macOS runner and a real build (CodeQL has no buildless mode for
          # Swift, and autobuild looks for an Xcode project that is generated,
          # not committed). `swift build` compiles the package's products, which
          # is what CodeQL needs to extract.
          - language: swift
            runs-on: macos-26
            build-mode: manual
          # Python tooling: conductor daemon and Scripts/ automation.
          - language: python
            runs-on: ubuntu-latest
            build-mode: none
          # GitHub Actions workflow analysis (the same rules that produced
          # the current cache-poisoning alerts under default setup).
          - language: actions
            runs-on: ubuntu-latest
            build-mode: none
    permissions:
      contents: read
      # Needed to upload SARIF results to the code-scanning API.
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Resolve deps before Initialize CodeQL so git/download children stay
      # outside the traced build window; both SwiftPM steps run through the
      # token scrubber, matching the repo's other build entry points
      # (run_without_github_tokens.sh covers package resolution too).
      - name: Resolve Swift package dependencies
        if: matrix.language == 'swift'
        run: Scripts/run_without_github_tokens.sh python3 Scripts/ci_resolve_packages.py

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Manual Swift build, single architecture per GitHub's CodeQL guidance.
      # The compiled cache is intentionally NOT restored because the compiler
      # must actually run during this job or the database is empty.
      - name: Build Swift package for analysis
        if: matrix.language == 'swift'
        run: Scripts/run_without_github_tokens.sh swift build --arch arm64 --force-resolved-versions

      # No dependabot actor guard here: GitHub permits security-events uploads
      # on pull_request-triggered runs even with Dependabot's read-only
      # GITHUB_TOKEN (docs.github.com/en/code-security/reference/code-scanning/
      # troubleshoot-analysis-errors/resource-not-accessible).
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # high keeps adoption noise down; the repo's only dependency
          # ecosystem is SwiftPM (Package.resolved), which the action reads.
          fail-on-severity: high
