name: Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Weekly scan, Tuesday 03:37 UTC.
    - cron: '37 3 * * 2'
  workflow_dispatch:

concurrency:
  group: security-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Swift is the primary language (~93% of code). Swift requires a
          # macOS runner and a real build (CodeQL has no buildless mode for
          # Swift, and autobuild looks for an Xcode project that is generated,
          # not committed). `swift build` compiles every SwiftPM target, which
          # is what CodeQL needs to extract.
          - language: swift
            runs-on: macos-26
            build-mode: manual
          # Python tooling: conductor daemon and Scripts/ automation.
          - language: python
            runs-on: ubuntu-latest
            build-mode: none
          # GitHub Actions workflow analysis (the same rules that produced
          # the current cache-poisoning alerts under default setup).
          - language: actions
            runs-on: ubuntu-latest
            build-mode: none
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Manual Swift build, single architecture per GitHub's CodeQL guidance.
      # No build cache is restored on purpose: the compiler must actually run
      # during this job or the Swift database would be empty.
      - name: Build Swift package for analysis
        if: matrix.language == 'swift'
        run: swift build --arch arm64 --force-resolved-versions

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
