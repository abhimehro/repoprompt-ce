runs-on: macos
# One-time setup (e.g., install system tools, global CLIs).
# gitleaks matches the CI secret-scan job (.github/workflows/ci.yml "Install
# pinned gitleaks"): the version is read from ci.yml and the SHA-256 from the
# release's checksums file, so this stays in lockstep automatically.
initialize: |
  set -euo pipefail
  # Version follows ci.yml's pinned gitleaks install; fall back if unparsed.
  version="$(sed -n 's/.*gitleaks_\([0-9.]*\)_linux_x64.*/\1/p' .github/workflows/ci.yml | head -n1)"
  version="${version:-8.30.1}"
  case "$(uname -m)" in
    arm64)  arch="arm64" ;;
    x86_64) arch="x64" ;;
    *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
  esac
  asset="gitleaks_${version}_darwin_${arch}.tar.gz"
  tmpdir="$(mktemp -d)"
  trap 'rm -rf "${tmpdir}"' EXIT
  archive="${tmpdir}/${asset}"
  curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${asset}" -o "$archive"
  # SHA-256 comes from the release's own checksums file, so nothing drifts.
  sha="$(curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt" | awk -v a="${asset}" '$2 == a { print $1 }')"
  [ -n "${sha}" ] || { echo "no checksum published for ${asset}" >&2; exit 1; }
  echo "${sha}  ${archive}" | shasum -a 256 -c -
  tar -xzf "$archive" -C "${tmpdir}" gitleaks
  bindir="$(brew --prefix 2>/dev/null || echo /usr/local)/bin"
  mkdir -p "${bindir}" 2>/dev/null || sudo -n mkdir -p "${bindir}"
  install -m 0755 "${tmpdir}/gitleaks" "${bindir}/gitleaks" 2>/dev/null \
    || sudo -n install -m 0755 "${tmpdir}/gitleaks" "${bindir}/gitleaks"
  test "$("${bindir}/gitleaks" version)" = "${version}"
  resolved="$(command -v gitleaks || true)"
  [ "${resolved}" = "${bindir}/gitleaks" ] \
    || echo "warning: PATH resolves gitleaks to '${resolved:-<none>}'" >&2
  "${bindir}/gitleaks" version
# Install project dependencies (runs during builds, surfaced to agent at session start).
maintenance: |
  true
knowledge:
  - name: preflight
    contents: |
      .agents/skills/rpce-contribution-check/scripts/preflight.sh commit   # before committing
      .agents/skills/rpce-contribution-check/scripts/preflight.sh push     # before pushing
  - name: guardrails
    contents: |
      ./Scripts/guardrails.sh   # source-layout + modularization ratchet gates
